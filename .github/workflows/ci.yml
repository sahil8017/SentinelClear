name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install ruff mypy
      - name: Run Ruff
        run: ruff check . || true
      - name: Run Mypy
        run: mypy . || true

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Bandit
        run: pip install bandit
      - name: Run Bandit
        run: bandit -r app/ || true
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4
      - name: Copy env file
        run: cp .env.example .env
      - name: Prepare build context
        run: |
          mkdir -p frontend/dist
          echo '{"type":"service_account","project_id":"ci-placeholder"}' > service-account.json
- name: Clean up any existing containers
  run: docker compose down -v 2>/dev/null || true
- name: Start services
  run: |
    docker compose up -d --build postgres-db rabbitmq redis neo3j api-gateway async-worker nginx
      - name: Wait for API health
        run: |
          echo "Waiting for API health..."
          max_attempts=36
          for i in $(seq 1 "$max_attempts"); do
            health_response="$(curl -sS http://localhost:8000/health 2>/dev/null || true)"
            if [ -n "$health_response" ] && echo "$health_response" | grep -q '"status":"healthy"'; then
              echo "✅ API is healthy after attempt $i"
              exit 0
            fi
            sleep 5
          done
          echo "❌ API failed health checks after $max_attempts attempts"
          echo "Checking Docker logs for debugging:"
          docker compose logs
          exit 1
      - name: Run Python tests
        run: docker compose exec -T api-gateway python tests/test_everything.py
      - name: Cleanup
        if: always()
        run: docker compose down -v

  docker-publish:
    needs: [lint, security-scan, test]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Downcase repository name
        run: |
          echo "REPO_LC=${GITHUB_REPOSITORY,,}" >> ${GITHUB_ENV}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ env.REPO_LC }}/api-gateway:latest