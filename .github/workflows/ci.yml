name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Copy env file
        run: cp .env.example .env

      - name: Start services
        run: docker compose up -d --build

      - name: Wait for API health
        run: |
          echo "Waiting for API..."
          for i in {1..30}; do
            if curl -s -f http://localhost:8000/health > /dev/null; then
              echo "API is ready"
              exit 0
            fi
            sleep 5
          done
          docker compose logs
          exit 1

      - name: Run Python tests
        run: docker compose exec -T api-gateway python tests/test_everything.py

      - name: Cleanup
        if: always()
        run: docker compose down -v

  build-frontend:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build frontend
        run: |
          if [ -d "frontend" ]; then
            cd frontend && npm ci && npm run build
          else
            echo "No frontend, skipping"
          fi