resolver 127.0.0.11 valid=10s ipv6=off;

upstream fastapi {
  least_conn;
  server api-gateway:8000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;

  location /.well-known/acme-challenge/ {
      root /var/www/certbot;
  }

  location / {
      return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  server_name _;

  ssl_certificate /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

  # Security headers
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header X-XSS-Protection "1; mode=block" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Cross-Origin-Opener-Policy "unsafe-none" always;

  # Rate limiting zone
  limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

  # Frontend SPA
  root /usr/share/nginx/html;
  index index.html;

  # API proxy
  location /api/ {
    limit_req zone=api_limit burst=20 nodelay;
    proxy_pass http://fastapi/api/v1/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
  }

  # Health proxy
  location /health {
    proxy_pass http://fastapi/health;
    proxy_set_header Host $host;
  }

  # WebSocket proxy
  location /ws/ {
    proxy_pass http://fastapi/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }

  # Grafana proxy
  location /grafana/ {
    proxy_pass http://grafana:3000/;
    proxy_set_header Host $host;
  }

  # Static assets (JS/CSS/images) - serve directly
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|webm|mp4)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback - all other routes serve index.html
  location / {
    try_files $uri /index.html =404;
  }
}
