upstream fastapi { server api-gateway:8000; }

server {
  listen 80;
  
  # Forward API requests
  location /api/ { proxy_pass http://fastapi/; }
  
  # Forward WebSocket requests
  location /ws/  {
    proxy_pass http://fastapi/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
  }
  
  # Forward Grafana requests
  location /grafana/ { proxy_pass http://grafana:3000/; }
  
  # Rate Limiting
  # limit_req_zone is typically defined in http block, we'll configure it dynamically or just rely on backend.
  # For simplicity, static files will take precendence
  location / {
    root /usr/share/nginx/html;
    try_files $uri $uri/ /index.html;
  }
}
