# Docker's internal DNS — re-resolves service names dynamically (handles replicas/restarts)
resolver 127.0.0.11 valid=10s ipv6=off;

upstream fastapi {
  least_conn;
  server api-gateway:8000;
  keepalive 32;
}

server {
  listen 80;
  listen 8000;
  server_name _;

  add_header Cross-Origin-Opener-Policy "unsafe-none" always;

  # Frontend SPA
  root /usr/share/nginx/html;
  index index.html;

  # API v1 proxy (as-is)
  location /api/v1/ {
    proxy_pass http://fastapi;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Frontend API proxy (rewrites /api/ to /api/v1/)
  location /api/ {
    rewrite ^/api/(.*)$ /api/v1/$1 break;
    proxy_pass http://fastapi;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # Health proxy
  location /health {
    proxy_pass http://fastapi/health;
    proxy_set_header Host $host;
  }

  # Docs proxy
  location /docs {
    proxy_pass http://fastapi/docs;
    proxy_set_header Host $host;
  }

  # OpenAPI proxy
  location /openapi.json {
    proxy_pass http://fastapi/openapi.json;
    proxy_set_header Host $host;
  }

  # Metrics proxy
  location /metrics {
    proxy_pass http://fastapi/metrics;
    proxy_set_header Host $host;
  }

  # Admin proxy
  location /admin/ {
    proxy_pass http://fastapi;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 120s;
  }

  # WebSocket proxy
  location /ws/ {
    proxy_pass http://fastapi/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_read_timeout 86400s;
  }

  # Grafana proxy
  location /grafana/ {
    proxy_pass http://grafana:3000/;
    proxy_set_header Host $host;
  }

  # Static assets (JS/CSS/images) - serve directly
  location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp|webm|mp4)$ {
    try_files $uri =404;
    expires 30d;
    add_header Cache-Control "public, immutable";
  }

  # SPA fallback - all other routes serve index.html
  location / {
    try_files $uri /index.html =404;
  }
}
